<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cubo_login">
    <div id="login_title">
      <h1>Agenda</h1>
    </div>

    <form id="input_user">
      <div class="campo">
        <label for="login">Login</label>
        <input type="text" id="login" class="placeholder" placeholder="exemplo: paulo01...">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" class="placeholder" placeholder="sua senha de 4 digitos...">
      </div>

      <div id="botao_login">
        <button type="submit">Entrar</button>
      </div>
    </form>
  </div>
  <script src="main.js"></script>
</body>
</html>
